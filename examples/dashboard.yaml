# A simple dashboard card. In Home Assistant: open a dashboard -> pencil
# (edit) -> Add card -> Manual, and paste this. Rename model3/modely to your
# prefixes.
type: vertical-stack
cards:
  - type: entities
    title: EV charging
    entities:
      - entity: sensor.ev_charge_allocation
        name: Allocation now
      - entity: input_number.ev_house_max_current
      - entity: input_number.ev_shared_max_current
  - type: entities
    title: Model3
    entities:
      - sensor.model3_battery_level
      - sensor.model3_charging_state
      - sensor.model3_charger_actual_current
      - input_number.model3_charge_limit
      - input_number.model3_desired_charge_amps
      - entity: sensor.model3_charge_schedule_debug
        name: Tonight's plan
      - input_button.reschedule_model3_charge
  - type: entities
    title: Modely
    entities:
      - sensor.modely_battery_level
      - sensor.modely_charging_state
      - sensor.modely_charger_actual_current
      - input_number.modely_charge_limit
      - input_number.modely_desired_charge_amps
      - entity: sensor.modely_charge_schedule_debug
        name: Tonight's plan
      - input_button.reschedule_modely_charge
