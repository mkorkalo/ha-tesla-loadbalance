# Copy to secrets.yaml (same folder) and fill in. secrets.yaml is never committed.

# Home Assistant -> your profile (bottom left) -> Security ->
# "Long-lived access tokens" -> Create token. Paste it here.
ha_token: PASTE_TOKEN_HERE

# Roughly where you live (only used for sunrise/sunset; two decimals is plenty).
latitude: 60.17
longitude: 24.94
time_zone: Europe/Helsinki
